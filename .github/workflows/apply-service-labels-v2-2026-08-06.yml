name: Cambiar etiquetas visibles de servicios v2

on:
  push:
    branches:
      - contenido-habilitacion-admin-2026-08-06

permissions:
  contents: write

jobs:
  actualizar-etiquetas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama aislada
        uses: actions/checkout@v4
        with:
          ref: contenido-habilitacion-admin-2026-08-06
          fetch-depth: 0

      - name: Cambiar etiquetas conservando cada valor existente
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import difflib

          path = Path('index.html')
          raw = path.read_bytes()
          had_bom = raw.startswith(b'\xef\xbb\xbf')
          before = raw.decode('utf-8-sig')

          labels = {
              'Valoración Funcional': 'Valoración fisioterapéutica inicial',
              'Readaptación Funcional': 'Rehabilitación y readaptación funcional',
          }
          values_before = []
          changed = {key: 0 for key in labels}
          option_re = re.compile(r'<option\b(?P<attrs>[^>]*)>(?P<label>[^<]*)</option>', re.IGNORECASE)

          def replace_option(match):
              attrs = match.group('attrs')
              label_raw = match.group('label')
              old = label_raw.strip()
              if old not in labels:
                  return match.group(0)

              value_match = re.search(r'\bvalue\s*=\s*(["\'])(.*?)\1', attrs, re.IGNORECASE)
              if value_match:
                  # Conserva exactamente el valor que ya use cada selector.
                  value = value_match.group(2)
                  new_attrs = attrs
              else:
                  # Sin value, el navegador usaba el texto como valor. Se fija el texto anterior.
                  value = old
                  new_attrs = attrs + f' value="{old}"'

              values_before.append((old, value))
              leading = label_raw[:len(label_raw) - len(label_raw.lstrip())]
              trailing = label_raw[len(label_raw.rstrip()):]
              changed[old] += 1
              return f'<option{new_attrs}>{leading}{labels[old]}{trailing}</option>'

          after = option_re.sub(replace_option, before)

          for old, count in changed.items():
              if count < 1:
                  raise SystemExit(f'No se encontró ninguna etiqueta visible para {old}')

          # Solo pueden variar líneas que contengan opciones HTML.
          diff = list(difflib.unified_diff(before.splitlines(), after.splitlines(), lineterm=''))
          content_changes = [line for line in diff if line.startswith(('+', '-')) and not line.startswith(('+++', '---'))]
          if not content_changes:
              raise SystemExit('No se produjeron cambios')
          bad_lines = [line for line in content_changes if '<option' not in line.lower()]
          if bad_lines:
              raise SystemExit('Se detectaron cambios fuera de opciones HTML: ' + repr(bad_lines[:5]))

          # Comprobar que cada valor preexistente sigue asociado con la etiqueta nueva.
          for old, value in values_before:
              new = labels[old]
              pattern = re.compile(
                  r'<option\b[^>]*\bvalue\s*=\s*(["\'])' + re.escape(value) + r'\1[^>]*>\s*' + re.escape(new) + r'\s*</option>',
                  re.IGNORECASE,
              )
              if not pattern.search(after):
                  raise SystemExit(f'No se conservó el valor interno {value!r} de {old!r}')

          # Proteger lógica, precios, combos y paquetes.
          required = [
              "'Valoración Funcional':",
              "'Readaptación Funcional':",
              "[/valoracion/,                                  'Valoración Funcional'",
              "[/readaptacion/,                                'Readaptación Funcional'",
              '<option value="Readaptación">Rehabilitación y readaptación funcional</option>',
              'Combo Diagnóstico Pro',
              'Paquete Readaptación Inicio',
              'Paquete Readaptación Avance',
              'Paquete Readaptación Total',
              'const _precios =',
              'const costosReales =',
          ]
          for needle in required:
              if needle not in after:
                  raise SystemExit(f'Se alteró o desapareció una estructura protegida: {needle}')

          forbidden = [
              'value="Valoración fisioterapéutica inicial"',
              'value="Rehabilitación y readaptación funcional"',
              "value='Valoración fisioterapéutica inicial'",
              "value='Rehabilitación y readaptación funcional'",
              '<<<<<<<',
              '>>>>>>>',
          ]
          for needle in forbidden:
              if needle in after:
                  raise SystemExit(f'Valor interno no permitido o conflicto detectado: {needle}')

          encoded = after.encode('utf-8')
          if had_bom:
              encoded = b'\xef\xbb\xbf' + encoded
          path.write_bytes(encoded)

          print('Etiquetas actualizadas:', changed)
          print('Valores preservados:', sorted(set(values_before)))
          print('Líneas de opción modificadas:', len(content_changes))
          PY

      - name: Validar HTML, formato y alcance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser

          raw = Path('index.html').read_bytes()
          text = raw.decode('utf-8-sig')

          class Parser(HTMLParser):
              pass
          Parser().feed(text)

          if b'\r\n' not in raw:
              raise SystemExit('Se perdió el formato CRLF original')
          for needle in [
              'Valoración fisioterapéutica inicial',
              'Rehabilitación y readaptación funcional',
              'Combo Diagnóstico Pro',
              'Paquete Readaptación Inicio',
              'Paquete Readaptación Avance',
              'Paquete Readaptación Total',
          ]:
              if needle not in text:
                  raise SystemExit(f'Falta contenido esperado: {needle}')
          print('HTML, formato, combos y paquetes verificados.')
          PY
          git diff --stat

      - name: Guardar únicamente index.html en la rama aislada
        shell: bash
        run: |
          rm -f .github/workflows/apply-service-labels-2026-08-06.yml
          rm -f .github/workflows/apply-service-labels-v2-2026-08-06.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-service-labels-2026-08-06.yml .github/workflows/apply-service-labels-v2-2026-08-06.yml
          git commit -m "feat: actualizar etiquetas visibles de valoración y rehabilitación"
          git push origin HEAD:contenido-habilitacion-admin-2026-08-06
