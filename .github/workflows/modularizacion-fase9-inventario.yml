name: Fase 9 — Inventario Códigos REF y bono

on:
  push:
    branches:
      - modularizacion-panel-fase9-referidos-bonos-2026-08-05
    paths:
      - MODULARIZACION_FASE9_INVENTARIO.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modularizacion-panel-fase9-referidos-bonos-inventario
  cancel-in-progress: false

jobs:
  inventario-referidos:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama aislada
        uses: actions/checkout@v4
        with:
          ref: modularizacion-panel-fase9-referidos-bonos-2026-08-05
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirmar aislamiento
        run: |
          test "$(git branch --show-current)" = "modularizacion-panel-fase9-referidos-bonos-2026-08-05"
          git fetch origin modularizacion-panel-fase8-base-datos-2026-08-05
          git fetch origin main

      - name: Generar inventario
        run: node tools/inventario-referidos-fase9.mjs index.html MODULARIZACION_FASE9_INVENTARIO_RESULTADO.md

      - name: Validar inventario
        run: |
          test -s MODULARIZACION_FASE9_INVENTARIO_RESULTADO.md
          grep -q 'Fase 9 Códigos REF y bono' MODULARIZACION_FASE9_INVENTARIO_RESULTADO.md
          grep -q '`renderCodigos`' MODULARIZACION_FASE9_INVENTARIO_RESULTADO.md
          grep -q '`BONO_VALOR`' MODULARIZACION_FASE9_INVENTARIO_RESULTADO.md
          grep -q 'Agenda y las Fases 1 a 8 permanecen fuera' MODULARIZACION_FASE9_INVENTARIO_RESULTADO.md

      - name: Confirmar que no cambió código funcional
        run: |
          git diff --exit-code origin/modularizacion-panel-fase8-base-datos-2026-08-05 -- \
            index.html js/core js/modules

      - name: Guardar únicamente el informe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MODULARIZACION_FASE9_INVENTARIO_RESULTADO.md
          if git diff --cached --quiet; then
            echo "El inventario ya estaba actualizado."
          else
            git commit -m "Inventariar Códigos REF y bono"
            git push origin HEAD:modularizacion-panel-fase9-referidos-bonos-2026-08-05
          fi

      - name: Resumen
        run: |
          echo "INVENTARIO FASE 9 COMPLETADO"
          echo "No se modificó main ni el panel publicado."
