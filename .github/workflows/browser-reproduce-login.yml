name: Browser reproduce login

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/browser-reproduce-login.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Use installed Chrome
        run: npm install puppeteer-core@24.15.0 --no-save
      - name: Reproduce login
        shell: bash
        run: |
          cat > /tmp/reproduce.js <<'NODE'
          const puppeteer = require('puppeteer-core');
          const fs = require('fs');
          const {execSync}=require('child_process');
          (async()=>{
            const out=[];
            let chrome='';
            for (const c of ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser']) if(fs.existsSync(c)){chrome=c;break;}
            out.push('CHROME='+chrome);
            if(!chrome) throw new Error('No browser executable');
            const browser=await puppeteer.launch({headless:true,executablePath:chrome,args:['--no-sandbox','--disable-setuid-sandbox']});
            const page=await browser.newPage();
            page.on('console',m=>out.push('CONSOLE '+m.type()+': '+m.text()));
            page.on('requestfailed',r=>out.push('FAILED '+r.method()+' '+r.url()+' :: '+(r.failure()?.errorText||'')));
            page.on('response',r=>{if(/script\.google|googleusercontent/.test(r.url())) out.push('RESPONSE '+r.status()+' '+r.url());});
            page.on('pageerror',e=>out.push('PAGEERROR '+(e.stack||e)));
            try{
              await page.goto('https://admin.cuidandotefisioterapia.com/?browserdiag=20260802',{waitUntil:'networkidle2',timeout:90000});
              await page.type('#userInput','diagnostico');
              await page.type('#pwInput','__INVALID_BROWSER_TEST__');
              await page.click('#loginBtn');
              await new Promise(r=>setTimeout(r,12000));
              out.push('BUTTON='+await page.$eval('#loginBtn',e=>e.innerText));
              out.push('ERROR='+await page.$eval('#loginErr',e=>e.innerText));
              out.push('ERROR_DISPLAY='+await page.$eval('#loginErr',e=>getComputedStyle(e).display));
            }catch(e){out.push('TESTERROR '+(e.stack||e));}
            await browser.close();
            fs.writeFileSync('browser-login-diagnostics.txt',out.join('\n')+'\n');
          })().catch(e=>{fs.writeFileSync('browser-login-diagnostics.txt','FATAL '+(e.stack||e)+'\n');process.exitCode=0;});
          NODE
          node /tmp/reproduce.js
      - name: Commit result and remove workflow
        run: |
          rm -rf node_modules package-lock.json package.json
          rm -f .github/workflows/browser-reproduce-login.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(login): registrar reproducción en navegador" || exit 0
          git push
