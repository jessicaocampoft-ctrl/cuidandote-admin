name: Fase 4 — Extraer bloques de Pagos

on:
  push:
    branches:
      - modularizacion-panel-fase4-pagos-2026-08-05
    paths:
      - MODULARIZACION_FASE4_BLOQUES_TRIGGER.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extraer:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama aislada
        uses: actions/checkout@v4
        with:
          ref: modularizacion-panel-fase4-pagos-2026-08-05
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extraer bloques exactos
        run: node tools/extract-payments-phase4-block.mjs index.html

      - name: Guardar resultado en la rama aislada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MODULARIZACION_FASE4_BLOQUES.md
          if git diff --cached --quiet; then
            echo "Los bloques ya estaban actualizados."
          else
            git commit -m "Extraer bloques exactos del módulo de Pagos"
            git push origin HEAD:modularizacion-panel-fase4-pagos-2026-08-05
          fi
