name: Fix WhatsApp emojis

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-whatsapp-emojis.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-whatsapp-emojis-2026-08-26
  cancel-in-progress: false

jobs:
  fix-emojis:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Corregir emojis de WhatsApp
        shell: python
        run: |
          from pathlib import Path

          path = Path('js/modules/whatsapp-tools.js')
          text = path.read_text(encoding='utf-8')

          replacements = [
              ("    'Hola ' + waNombre(nombre) + '! Te escribo para confirmar tu cita \\ud83d\\udccb',",
               "    'Hola ' + waNombre(nombre) + '! Te escribo para confirmar tu cita ' + String.fromCodePoint(0x1F4CB),"),
              ("    '\\uD83D\\uDCCD ' + (modalidad === 'Domicilio' ? 'A domicilio' : 'En sitio'),",
               "    String.fromCodePoint(0x1F4CD) + ' ' + (modalidad === 'Domicilio' ? 'A domicilio' : 'En sitio'),"),
              ("      '\\u2B50 Valor: *' + precio + '*',",
               "      String.fromCodePoint(0x2B50) + ' Valor: *' + precio + '*',"),
              ("      '\\uD83C\\uDFE6 Bancolombia Ahorros: 91257857099',",
               "      String.fromCodePoint(0x1F3E6) + ' Bancolombia Ahorros: 91257857099',"),
              ("      '\\uD83D\\uDCF1 Nequi: 3136467945',",
               "      String.fromCodePoint(0x1F4F1) + ' Nequi: 3136467945',"),
              ("      '\\uD83D\\uDDDD\\uFE0F Llave: 1010124692',",
               "      String.fromCodePoint(0x1F5DD, 0xFE0F) + ' Llave: 1010124692',"),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'No se encontró el patrón esperado: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8-sig')
          old_src = '<script src="js/modules/whatsapp-tools.js"></script>'
          new_src = '<script src="js/modules/whatsapp-tools.js?v=20260826-emoji1"></script>'
          if old_src in index:
              index = index.replace(old_src, new_src, 1)
          elif new_src not in index:
              raise SystemExit('No se encontró la referencia al módulo whatsapp-tools.js')
          index_path.write_text(index, encoding='utf-8-sig')

      - name: Validar corrección
        run: |
          grep -F "String.fromCodePoint(0x1F4CB)" js/modules/whatsapp-tools.js
          grep -F "String.fromCodePoint(0x1F4CD)" js/modules/whatsapp-tools.js
          grep -F "String.fromCodePoint(0x2B50)" js/modules/whatsapp-tools.js
          grep -F "whatsapp-tools.js?v=20260826-emoji1" index.html

      - name: Limpiar workflow temporal y guardar cambios
        run: |
          rm -f .github/workflows/fix-whatsapp-emojis.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/modules/whatsapp-tools.js index.html .github/workflows/fix-whatsapp-emojis.yml
          git commit -m "Corregir emojis en confirmaciones de WhatsApp"
          git push origin HEAD:main
