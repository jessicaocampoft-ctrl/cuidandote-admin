name: Inventario Fase 24

on:
  push:
    branches:
      - modularizacion-panel-fase24-emergencia-encuestas-perfil-accesibilidad-2026-08-06
    paths:
      - INVENTARIAR_FASE24.md

permissions:
  contents: write

jobs:
  inventariar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modularizacion-panel-fase24-emergencia-encuestas-perfil-accesibilidad-2026-08-06
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirmar base
        run: |
          git fetch origin modularizacion-panel-fase23-pacientes-historial-busqueda-2026-08-06
          git merge-base --is-ancestor origin/modularizacion-panel-fase23-pacientes-historial-busqueda-2026-08-06 HEAD
      - name: Inventariar
        run: node tools/inventariar-fase24.mjs index.html INVENTARIO_FASE24.md
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add INVENTARIO_FASE24.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Inventariar alcance de la Fase 24"
          git pull --rebase origin modularizacion-panel-fase24-emergencia-encuestas-perfil-accesibilidad-2026-08-06
          git push origin HEAD:modularizacion-panel-fase24-emergencia-encuestas-perfil-accesibilidad-2026-08-06
