name: Extract passport function

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-passport-function.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract functions
        shell: python
        run: |
          from pathlib import Path
          import re
          out=[]
          for name in ('index.html','admin.html'):
            p=Path(name)
            if not p.exists(): continue
            text=p.read_text(encoding='utf-8-sig')
            matches=list(re.finditer(r'async function abrirPasaporte\s*\(\)\s*\{',text))
            out.append('===== '+name+' =====')
            for m in matches:
              start=m.start(); i=m.end(); depth=1
              while i<len(text) and depth:
                if text[i]=='{': depth+=1
                elif text[i]=='}': depth-=1
                i+=1
              out.append(text[start:i])
          Path('passport-open-function.txt').write_text('\n\n'.join(out)+'\n',encoding='utf-8')
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/extract-passport-function.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(pasaporte): registrar función de apertura"
          git push
