name: Validar y publicar administrador

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-admin
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar versión para validar
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar funciones críticas
        run: node tools/validate-release.mjs

      - name: Guardar respaldo del código validado
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-administrador-${{ github.sha }}
          retention-days: 90
          path: |
            index.html
            js
            tools/validate-release.mjs
            .github/workflows/manual-pages-admin.yml

  preparar:
    needs: validar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar la versión aprobada
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos del administrador
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            ./ _site/

      - name: Cargar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: preparar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
          reporting_interval: 5000
          error_count: 30
