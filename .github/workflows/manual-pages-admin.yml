name: Publicar administrador

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-admin
  cancel-in-progress: true

jobs:
  validar:
    name: Validar antes de publicar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar la versión aprobada
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar estructura y contratos críticos
        run: node tools/validar-prepublicacion.mjs

      - name: Validar sintaxis de JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Revisando $file"
            node --check "$file"
          done < <(find js -type f -name '*.js' -print0)
          node --check public-schedule-admin.js

      - name: Confirmar ausencia de conflictos Git
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' -- index.html js public-schedule-admin.js; then
            echo 'Se encontraron marcadores de conflicto Git.'
            exit 1
          fi
          echo 'Sin marcadores de conflicto Git.'

  preparar:
    needs: validar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar la versión aprobada
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos del administrador
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            ./ _site/

      - name: Cargar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: preparar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
          reporting_interval: 5000
          error_count: 30
