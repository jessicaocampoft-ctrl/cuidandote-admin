name: Fase 11 — Revisar funciones de Finanzas

on:
  push:
    branches:
      - modularizacion-panel-fase11-finanzas-2026-08-05
    paths:
      - MODULARIZACION_FASE11_FUNCIONES_TRIGGER.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revisar-funciones:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama aislada
        uses: actions/checkout@v4
        with:
          ref: modularizacion-panel-fase11-finanzas-2026-08-05
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirmar aislamiento
        run: |
          test "$(git branch --show-current)" = "modularizacion-panel-fase11-finanzas-2026-08-05"
          git fetch origin modularizacion-panel-fase10-paquetes-2026-08-05

      - name: Extraer funciones para revisión
        run: node tools/extraer-funciones-finanzas-fase11.mjs index.html MODULARIZACION_FASE11_FUNCIONES_DIAGNOSTICO.md

      - name: Confirmar que no cambió código funcional
        run: |
          test -s MODULARIZACION_FASE11_FUNCIONES_DIAGNOSTICO.md
          git diff --exit-code origin/modularizacion-panel-fase10-paquetes-2026-08-05 -- index.html js/core js/modules

      - name: Guardar revisión
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MODULARIZACION_FASE11_FUNCIONES_DIAGNOSTICO.md
          git diff --cached --quiet || (git commit -m "Revisar funciones del núcleo financiero" && git push origin HEAD:modularizacion-panel-fase11-finanzas-2026-08-05)
