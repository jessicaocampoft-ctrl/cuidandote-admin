name: Auditoría automática del panel

on:
  push:
    branches:
      - auditoria-panel-2026-08-04
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auditoria-panel-aislada
  cancel-in-progress: false

jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          ref: auditoria-panel-2026-08-04

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Retirar únicamente registros insertados antes del DOCTYPE
        run: node tools/clean-patch-log.mjs index.html

      - name: Aplicar correcciones estructurales de fase 1
        run: node tools/fix-panel-phase1.mjs index.html

      - name: Extraer contexto exacto de los hallazgos
        run: node tools/inspect-panel.mjs index.html

      - name: Guardar correcciones seguras en la rama aislada
        run: |
          if [ -z "$(git status --porcelain -- index.html AUDIT_CONTEXT.md)" ]; then
            echo "No había cambios seguros pendientes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html AUDIT_CONTEXT.md
            git commit -m "Corregir estructura inicial del panel en rama de auditoría"
            git push origin HEAD:auditoria-panel-2026-08-04
          fi

      - name: Revisar estructura, JavaScript y contratos críticos
        run: node tools/audit-panel.mjs index.html

      - name: Guardar informe incluso si hay errores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-auditoria-panel
          path: audit-output/
          if-no-files-found: warn
