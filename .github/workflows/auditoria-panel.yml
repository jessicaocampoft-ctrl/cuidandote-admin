name: Auditoría automática del panel

on:
  push:
    branches:
      - auditoria-panel-2026-08-04
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auditoria-panel-aislada
  cancel-in-progress: false

jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          ref: auditoria-panel-2026-08-04

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Retirar únicamente registros insertados antes del DOCTYPE
        run: node tools/clean-patch-log.mjs index.html

      - name: Aplicar correcciones estructurales de fase 1
        run: node tools/fix-panel-phase1.mjs index.html

      - name: Aplicar correcciones funcionales de fase 2
        run: node tools/fix-panel-phase2.mjs index.html

      - name: Aplicar correcciones de encuestas, Base de datos y voz
        run: node tools/fix-panel-phase4.mjs index.html

      - name: Guardar localmente la librería QR
        run: |
          mkdir -p vendor
          if [ ! -s vendor/qrcode.min.js ]; then
            curl --fail --silent --show-error --location "https://raw.githubusercontent.com/davidshimjs/qrcodejs/master/qrcode.min.js" --output vendor/qrcode.min.js
          fi
          test -s vendor/qrcode.min.js

      - name: Corregir Finanzas navegación y códigos QR
        run: node tools/fix-panel-browser.mjs index.html

      - name: Preparar la prueba funcional del navegador
        run: |
          node tools/fix-browser-smoke-test-v2.mjs tools/browser-smoke.mjs
          node tools/fix-browser-smoke-test-v3.mjs tools/browser-smoke.mjs

      - name: Descargar contrato actual del backend
        run: curl --fail --silent --show-error --location "https://raw.githubusercontent.com/jessicaocampoft-ctrl/jessicaocampoft-ctrl.github.io/main/google-apps-script.js" --output audit-backend.js

      - name: Comparar acciones del panel con Apps Script
        id: contract_audit
        continue-on-error: true
        run: node tools/audit-contracts.mjs index.html audit-backend.js

      - name: Inspeccionar acciones sin ruta aparente
        run: node tools/inspect-contract-actions.mjs index.html

      - name: Extraer contexto general de los hallazgos
        run: node tools/inspect-panel.mjs index.html

      - name: Extraer contexto exacto para fase 2
        run: node tools/extract-phase2.mjs index.html

      - name: Extraer advertencias de fase 3
        run: node tools/extract-phase3.mjs index.html

      - name: Extraer controles reales de fase 4
        run: node tools/extract-phase4.mjs index.html

      - name: Extraer fragmentos detallados de fase 4
        run: node tools/extract-phase4-details.mjs index.html

      - name: Extraer fallos detectados por el navegador
        run: node tools/extract-browser-failures.mjs index.html

      - name: Extraer detalle preciso de fallos del navegador
        run: node tools/extract-browser-details.mjs index.html

      - name: Guardar correcciones e informes en la rama aislada
        run: |
          if [ -z "$(git status --porcelain -- index.html tools/browser-smoke.mjs vendor/qrcode.min.js AUDIT_CONTEXT.md AUDIT_PHASE2.md AUDIT_PHASE3.md AUDIT_PHASE4.md AUDIT_PHASE4_DETAILS.md AUDIT_CONTRACTS.md AUDIT_CONTRACT_CONTEXT.md AUDIT_BROWSER_FAILURES.md AUDIT_BROWSER_DETAILS.md)" ]; then
            echo "No había cambios seguros pendientes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html tools/browser-smoke.mjs vendor/qrcode.min.js AUDIT_CONTEXT.md AUDIT_PHASE2.md AUDIT_PHASE3.md AUDIT_PHASE4.md AUDIT_PHASE4_DETAILS.md AUDIT_CONTRACTS.md AUDIT_CONTRACT_CONTEXT.md AUDIT_BROWSER_FAILURES.md AUDIT_BROWSER_DETAILS.md
            git commit -m "Corregir Finanzas navegación pagos y dependencia QR"
            git push origin HEAD:auditoria-panel-2026-08-04
          fi

      - name: Revisar estructura y JavaScript
        run: node tools/audit-panel.mjs index.html

      - name: Exigir contratos completos
        run: |
          node -e "const r=require('./audit-output/contratos-panel-backend.json'); if(r.missing.length){console.error('Acciones sin backend:',r.missing.join(', ')); process.exit(1)} console.log('Contratos completos:',r.apiRequestedActions.length,'acciones API verificadas')"

      - name: Recorrer el panel en navegador aislado
        run: node tools/browser-smoke.mjs index.html

      - name: Guardar informe incluso si hay errores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-auditoria-panel
          path: audit-output/
          if-no-files-found: warn
