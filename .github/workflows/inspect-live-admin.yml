name: Inspect live admin

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-live-admin.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare live admin with repository
        shell: python
        run: |
          from pathlib import Path
          import re, urllib.request, hashlib

          url='https://admin.cuidandotefisioterapia.com/?diag=20260802'
          req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
            live=r.read().decode('utf-8','replace')
            status=getattr(r,'status',None)
            final=r.geturl()
            headers=dict(r.headers.items())

          repo=Path('index.html').read_text(encoding='utf-8-sig')
          def extract(text):
            m_url=re.search(r"const\s+APPS_SCRIPT_URL\s*=\s*['\"]([^'\"]+)", text)
            m_login=re.search(r'async function doLogin\(\) \{.*?\n\}', text, re.S)
            return {
              'apps_url': m_url.group(1) if m_url else 'NOT FOUND',
              'login': m_login.group(0) if m_login else 'NOT FOUND',
              'sha256': hashlib.sha256(text.encode()).hexdigest(),
              'length': len(text),
            }
          a=extract(live); b=extract(repo)
          out=[]
          out += [f'status={status}',f'final={final}',f'live_length={a["length"]}',f'repo_length={b["length"]}',f'live_sha256={a["sha256"]}',f'repo_sha256={b["sha256"]}',f'same={a["sha256"]==b["sha256"]}',f'live_apps_url={a["apps_url"]}',f'repo_apps_url={b["apps_url"]}']
          out += ['','=== LIVE LOGIN ===',a['login'],'','=== REPO LOGIN ===',b['login'],'','=== LIVE HEADERS ===']
          out += [f'{k}: {v}' for k,v in headers.items()]
          Path('live-admin-diagnostics.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
      - name: Commit diagnostics and remove workflow
        run: |
          rm -f .github/workflows/inspect-live-admin.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(deploy): registrar estado publicado" || exit 0
          git push
