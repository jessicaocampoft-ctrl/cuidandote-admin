name: Verify admin after backend split

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-admin-after-split.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify stable admin, secure passport and published page
        shell: bash
        run: |
          set -u
          admin='https://script.google.com/macros/s/AKfycbzFlqrTerVorQDn0_u_D29rh3cTRstc1XBxYDAn5-2YyexMSpip0m2RPcjzJMK7VDjd/exec'
          passport='https://script.google.com/macros/s/AKfycbwYxtpVLIb5DH31Bvh8UemIGZ08l1UEMuIJPbFPXOW_X0yX5J756IZKzmYx5PYOdPDC/exec'
          live='https://admin.cuidandotefisioterapia.com/?verify=20260803-0300'
          result='backend-split-verification.txt'
          : > "$result"

          admin_body="$(curl -L -sS --max-time 45 -H 'Content-Type: text/plain;charset=UTF-8' --data '{"action":"adminLogin","user":"diagnostico","password":"__INVALID_VERIFY_SPLIT__"}' "$admin" 2>&1)"
          if printf '%s' "$admin_body" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*false'; then
            echo 'admin_endpoint_pass=true' >> "$result"
          else
            echo 'admin_endpoint_pass=false' >> "$result"
          fi
          printf 'admin_body=%s\n' "$(printf '%s' "$admin_body" | head -c 500 | tr '\n' ' ')" >> "$result"

          passport_body="$(curl -L -sS --max-time 45 "$passport?action=getPassportSecure&id=__INVALID__&token=__INVALID__" 2>&1)"
          if printf '%s' "$passport_body" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*false'; then
            echo 'passport_endpoint_pass=true' >> "$result"
          else
            echo 'passport_endpoint_pass=false' >> "$result"
          fi
          printf 'passport_body=%s\n' "$(printf '%s' "$passport_body" | head -c 500 | tr '\n' ' ')" >> "$result"

          curl -L -sS --max-time 45 "$live" -o /tmp/live-admin.html
          if grep -Fq "const APPS_SCRIPT_URL = '$admin';" /tmp/live-admin.html; then
            echo 'live_admin_backend_pass=true' >> "$result"
          else
            echo 'live_admin_backend_pass=false' >> "$result"
          fi
          if grep -Fq "const PASSPORT_APPS_SCRIPT_URL = '$passport';" /tmp/live-admin.html; then
            echo 'live_passport_backend_pass=true' >> "$result"
          else
            echo 'live_passport_backend_pass=false' >> "$result"
          fi

          if grep -q '^admin_endpoint_pass=true$' "$result" \
            && grep -q '^passport_endpoint_pass=true$' "$result" \
            && grep -q '^live_admin_backend_pass=true$' "$result" \
            && grep -q '^live_passport_backend_pass=true$' "$result"; then
            echo 'overall_pass=true' >> "$result"
          else
            echo 'overall_pass=false' >> "$result"
          fi
          cat "$result"

      - name: Commit verification and remove workflow
        run: |
          rm -f .github/workflows/verify-admin-after-split.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(login): registrar verificación tras separar backends" || exit 0
          git push
