name: Inventario Fase 21 — Operación de agenda

on:
  push:
    branches:
      - modularizacion-panel-fase21-operacion-agenda-2026-08-06
    paths:
      - INVENTARIAR_FASE21_OPERACION_AGENDA.md

permissions:
  contents: write

jobs:
  inventariar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modularizacion-panel-fase21-operacion-agenda-2026-08-06
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirmar base aislada
        run: |
          git fetch origin modularizacion-panel-fase20-voz-recordatorios-calendario-2026-08-06
          git merge-base --is-ancestor origin/modularizacion-panel-fase20-voz-recordatorios-calendario-2026-08-06 HEAD
          test "$(git branch --show-current)" = "modularizacion-panel-fase21-operacion-agenda-2026-08-06"
      - name: Crear inventario
        run: node tools/inventariar-fase21-operacion-agenda.mjs index.html INVENTARIO_FASE21_OPERACION_AGENDA.md
      - name: Guardar inventario
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add INVENTARIO_FASE21_OPERACION_AGENDA.md
          git commit -m "Inventariar operación de agenda para Fase 21"
          git pull --rebase origin modularizacion-panel-fase21-operacion-agenda-2026-08-06
          git push origin HEAD:modularizacion-panel-fase21-operacion-agenda-2026-08-06
