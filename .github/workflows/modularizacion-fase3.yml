name: Modularización segura — Fase 3 Sesión

on:
  push:
    branches:
      - modularizacion-panel-fase3-sesion-2026-08-05
    paths:
      - MODULARIZACION_FASE3.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modularizacion-panel-fase3-sesion
  cancel-in-progress: false

jobs:
  inventario-sesion:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama aislada
        uses: actions/checkout@v4
        with:
          ref: modularizacion-panel-fase3-sesion-2026-08-05
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirmar aislamiento respecto a producción
        run: |
          test "$(git branch --show-current)" = "modularizacion-panel-fase3-sesion-2026-08-05"
          git fetch origin main

      - name: Inventariar inicio de sesión y sesiones
        run: node tools/inspect-session-phase3.mjs index.html

      - name: Guardar inventario solo en la rama aislada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MODULARIZACION_FASE3_INVENTARIO.md
          if git diff --cached --quiet; then
            echo "El inventario ya estaba actualizado."
          else
            git commit -m "Inventariar inicio de sesión y manejo de sesiones"
            git push origin HEAD:modularizacion-panel-fase3-sesion-2026-08-05
          fi

      - name: Resumen
        run: |
          echo "INVENTARIO DE FASE 3 COMPLETADO"
          echo "No se modificó main ni se cambió la lógica del panel."
