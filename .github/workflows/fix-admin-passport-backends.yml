name: Separate admin and passport backends

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-admin-passport-backends.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Separate backends in admin files
        shell: python
        run: |
          from pathlib import Path
          import re

          stable_admin = 'https://script.google.com/macros/s/AKfycbzFlqrTerVorQDn0_u_D29rh3cTRstc1XBxYDAn5-2YyexMSpip0m2RPcjzJMK7VDjd/exec'
          secure_passport = 'https://script.google.com/macros/s/AKfycbwYxtpVLIb5DH31Bvh8UemIGZ08l1UEMuIJPbFPXOW_X0yX5J756IZKzmYx5PYOdPDC/exec'
          report = []

          for name in ('index.html', 'admin.html'):
            path = Path(name)
            if not path.exists():
              report.append(f'{name}: ausente')
              continue

            text = path.read_text(encoding='utf-8-sig')

            config_pattern = re.compile(
              r"const APPS_SCRIPT_URL\s*=\s*'https://script\.google\.com/macros/s/[^']+/exec';"
              r"(?:\s*const PASSPORT_APPS_SCRIPT_URL\s*=\s*'https://script\.google\.com/macros/s/[^']+/exec';)?",
              re.M
            )
            config = (
              f"const APPS_SCRIPT_URL = '{stable_admin}';\n"
              f"const PASSPORT_APPS_SCRIPT_URL = '{secure_passport}';"
            )
            text, config_count = config_pattern.subn(config, text, count=1)
            if config_count != 1:
              raise SystemExit(f'{name}: configuración APPS_SCRIPT_URL no localizada')

            # Cambiar únicamente llamadas cuyo action comienza por passport.
            text, plus_count = re.subn(
              r'\bAPPS_SCRIPT_URL\b(?=\s*\+\s*[\'\"]\?action=passport)',
              'PASSPORT_APPS_SCRIPT_URL',
              text
            )
            text, template_count = re.subn(
              r'\$\{APPS_SCRIPT_URL\}(?=\?action=passport)',
              '${PASSPORT_APPS_SCRIPT_URL}',
              text
            )

            if f"const APPS_SCRIPT_URL = '{stable_admin}';" not in text:
              raise SystemExit(f'{name}: backend estable no configurado')
            if f"const PASSPORT_APPS_SCRIPT_URL = '{secure_passport}';" not in text:
              raise SystemExit(f'{name}: backend del pasaporte no configurado')
            if "JSON.stringify({action: 'adminLogin', user, password: pw})" not in text:
              raise SystemExit(f'{name}: flujo adminLogin no encontrado')
            if re.search(r'\bAPPS_SCRIPT_URL\b\s*\+\s*[\'\"]\?action=passport', text):
              raise SystemExit(f'{name}: quedó una llamada passport en el backend general')
            if re.search(r'\$\{APPS_SCRIPT_URL\}\?action=passport', text):
              raise SystemExit(f'{name}: quedó una plantilla passport en el backend general')

            path.write_text(text, encoding='utf-8')
            report.append(f'{name}: config=1 plus={plus_count} template={template_count}')

          if not any(line.startswith('index.html:') for line in report):
            raise SystemExit('index.html no fue procesado')

          Path('backend-split-result.txt').write_text('\n'.join(report) + '\n', encoding='utf-8')
          print('\n'.join(report))

      - name: Commit corrected files
        run: |
          rm -f .github/workflows/fix-admin-passport-backends.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(login): restaurar backend estable y aislar pasaporte"
          git push
