name: Separate admin and passport backends

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-admin-passport-backends.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore stable admin backend and isolate passport backend
        shell: python
        run: |
          from pathlib import Path
          import re

          stable_admin = 'https://script.google.com/macros/s/AKfycbzFlqrTerVorQDn0_u_D29rh3cTRstc1XBxYDAn5-2YyexMSpip0m2RPcjzJMK7VDjd/exec'
          secure_passport = 'https://script.google.com/macros/s/AKfycbwYxtpVLIb5DH31Bvh8UemIGZ08l1UEMuIJPbFPXOW_X0yX5J756IZKzmYx5PYOdPDC/exec'

          changed=[]
          for name in ('index.html','admin.html'):
            path=Path(name)
            if not path.exists():
              continue
            text=path.read_text(encoding='utf-8-sig')

            text, n = re.subn(
              r"const APPS_SCRIPT_URL = 'https://script\.google\.com/macros/s/[^']+/exec';(?:\nconst PASSPORT_APPS_SCRIPT_URL = 'https://script\.google\.com/macros/s/[^']+/exec';)?",
              "const APPS_SCRIPT_URL = '" + stable_admin + "';\nconst PASSPORT_APPS_SCRIPT_URL = '" + secure_passport + "';",
              text,
              count=1
            )
            if n != 1:
              raise SystemExit(f'{name}: no se pudo actualizar la configuración de endpoints')

            text = text.replace("APPS_SCRIPT_URL + '?action=passport", "PASSPORT_APPS_SCRIPT_URL + '?action=passport")
            text = text.replace('`${APPS_SCRIPT_URL}?action=passport', '`${PASSPORT_APPS_SCRIPT_URL}?action=passport')

            if f"const APPS_SCRIPT_URL = '{stable_admin}';" not in text:
              raise SystemExit(f'{name}: backend estable no quedó configurado')
            if f"const PASSPORT_APPS_SCRIPT_URL = '{secure_passport}';" not in text:
              raise SystemExit(f'{name}: backend seguro del pasaporte no quedó configurado')
            if re.search(r'APPS_SCRIPT_URL\s*\+\s*[\'\"]\?action=passport', text):
              raise SystemExit(f'{name}: quedó una acción de pasaporte usando el backend general')
            if 'body: JSON.stringify({action: \'adminLogin\', user, password: pw})' not in text:
              raise SystemExit(f'{name}: login fue alterado inesperadamente')

            path.write_text(text,encoding='utf-8')
            changed.append(name)

          if not changed:
            raise SystemExit('No se encontraron archivos de administrador')
          print('Updated:', ', '.join(changed))

      - name: Verify both deployments
        shell: bash
        run: |
          set -euo pipefail
          admin='https://script.google.com/macros/s/AKfycbzFlqrTerVorQDn0_u_D29rh3cTRstc1XBxYDAn5-2YyexMSpip0m2RPcjzJMK7VDjd/exec'
          passport='https://script.google.com/macros/s/AKfycbwYxtpVLIb5DH31Bvh8UemIGZ08l1UEMuIJPbFPXOW_X0yX5J756IZKzmYx5PYOdPDC/exec'
          admin_response="$(curl -L -sS --max-time 40 -H 'Content-Type: text/plain;charset=UTF-8' --data '{"action":"adminLogin","user":"diagnostico","password":"__INVALID_SPLIT_TEST__"}' "$admin")"
          printf '%s' "$admin_response" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*false'
          passport_response="$(curl -L -sS --max-time 40 "$passport?action=passportEnsure&token=__INVALID_SPLIT_TEST__&nombre=Prueba")"
          printf '%s' "$passport_response" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*false'

      - name: Commit fix
        run: |
          rm -f .github/workflows/fix-admin-passport-backends.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html admin.html .github/workflows/fix-admin-passport-backends.yml
          git commit -m "fix(login): restaurar backend estable y aislar pasaporte"
          git push
