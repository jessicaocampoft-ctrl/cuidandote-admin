name: Fase 10 — Validar Paquetes

on:
  push:
    branches:
      - modularizacion-panel-fase10-paquetes-2026-08-05
    paths:
      - MODULARIZACION_FASE10_VALIDAR.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modularizacion-panel-fase10-paquetes-validar
  cancel-in-progress: false

jobs:
  validar-paquetes:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama aislada
        uses: actions/checkout@v4
        with:
          ref: modularizacion-panel-fase10-paquetes-2026-08-05
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirmar aislamiento
        run: |
          test "$(git branch --show-current)" = "modularizacion-panel-fase10-paquetes-2026-08-05"
          git fetch origin modularizacion-panel-fase9-referidos-bonos-2026-08-05
          git fetch origin main

      - name: Validar sintaxis y flujos
        run: |
          node --check js/modules/packages.js
          node tools/validar-paquetes-fase10.mjs index.html js/modules/packages.js

      - name: Confirmar módulos anteriores intactos
        run: |
          git diff --exit-code origin/modularizacion-panel-fase9-referidos-bonos-2026-08-05 -- \
            js/core/config.js js/core/api.js js/core/navigation.js js/core/session.js \
            js/modules/payments.js js/modules/passport.js js/modules/agenda.js \
            js/modules/appointment-create.js js/modules/appointment-edit.js \
            js/modules/team.js js/modules/database.js js/modules/referrals.js

      - name: Confirmar alcance funcional
        run: |
          CAMBIOS=$(git diff --name-only origin/modularizacion-panel-fase9-referidos-bonos-2026-08-05 -- 'js/**' | grep -v '^js/modules/packages.js$' || true)
          if [ -n "$CAMBIOS" ]; then
            echo "Se detectaron archivos JavaScript ajenos modificados:"
            echo "$CAMBIOS"
            exit 1
          fi
          grep -q 'global.PanelPackages = Object.freeze' js/modules/packages.js
          grep -q '<script src="js/modules/packages.js"></script>' index.html
          test "$(grep -o 'script src="js/modules/packages.js"' index.html | wc -l)" -eq 1

      - name: Generar informe
        run: |
          cat > MODULARIZACION_FASE10_RESULTADO.md <<'EOF'
          # Resultado de modularización — Fase 10 Paquetes

          - `js/modules/packages.js` creado.
          - 11 funciones propias de plantillas, asignación y consumo de paquetes separadas de `index.html`.
          - Los nombres usados por la vista permanecen mediante adaptadores compatibles.
          - Paquetes continúa usando el almacenamiento existente mediante `kvGet` y `kvSet`; no se introdujeron llamadas nuevas al servidor.
          - Persistencia de plantillas y paquetes asignados validada.
          - Métricas de activos, agotados, próximos a vencer y valor activo validadas.
          - Búsqueda y deduplicación de pacientes validadas.
          - Apertura de formularios y precarga de fecha validadas.
          - Consumo y ajuste de sesiones validados, incluyendo bloqueo de paquetes agotados y valores superiores al total.
          - Eliminación confirmada y cancelada validada.
          - Las Fases 1 a 9 permanecen sin cambios.
          - No se modificó `main`, Apps Script ni el panel publicado.
          EOF

      - name: Guardar resultado solo en la rama aislada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MODULARIZACION_FASE10_RESULTADO.md
          if git diff --cached --quiet; then
            echo "El resultado ya estaba actualizado."
          else
            git commit -m "Validar módulo Paquetes"
            git push origin HEAD:modularizacion-panel-fase10-paquetes-2026-08-05
          fi

      - name: Resumen
        run: |
          echo "FASE 10 COMPLETADA Y VALIDADA"
          echo "No se publicó en main."
