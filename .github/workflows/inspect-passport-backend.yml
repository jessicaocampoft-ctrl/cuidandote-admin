name: Inspect passport backend response

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-passport-backend.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect source and live endpoint
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "=== SOURCE ==="
            grep -n -A 180 -B 20 "function passportEnsure_" google-apps-script.js || true
            echo
            echo "=== PUBLIC ROUTE ==="
            curl -L -sS --max-time 35 "https://script.google.com/macros/s/AKfycbwYxtpVLIb5DH31Bvh8UemIGZ08l1UEMuIJPbFPXOW_X0yX5J756IZKzmYx5PYOdPDC/exec?action=getPassportSecure&id=PAS-DIAGNOSTIC&token=DIAGNOSTIC" || true
            echo
            echo "=== ENSURE WITHOUT SESSION ==="
            curl -L -sS --max-time 35 "https://script.google.com/macros/s/AKfycbwYxtpVLIb5DH31Bvh8UemIGZ08l1UEMuIJPbFPXOW_X0yX5J756IZKzmYx5PYOdPDC/exec?action=passportEnsure&nombre=DIAGNOSTIC&telefono=3000000000" || true
            echo
          } > passport-backend-diagnostics.txt

      - name: Commit diagnostics and remove workflow
        run: |
          rm -f .github/workflows/inspect-passport-backend.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(pasaporte): registrar respuesta segura" || exit 0
          git push
