name: Inspect passport backend response

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-passport-backend.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract secure passport backend
        shell: python
        run: |
          from pathlib import Path
          import re
          text = Path('google-apps-script.js').read_text(encoding='utf-8-sig')
          lines = text.splitlines()
          patterns = [
            r'function\s+passportEnsure_',
            r'function\s+passportCreate_',
            r'function\s+passport.*Link',
            r'getPassportSecure',
            r'PASSPORT_PUBLIC',
            r'passport\.link',
            r'publicUrl'
          ]
          hits=set()
          for i,line in enumerate(lines):
            if any(re.search(p,line,re.I) for p in patterns):
              for j in range(max(0,i-25), min(len(lines),i+180)):
                hits.add(j)
          out=[f'{j+1}: {lines[j]}' for j in sorted(hits)]
          Path('passport-backend-diagnostics.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')

      - name: Commit diagnostics and remove workflow
        run: |
          rm -f .github/workflows/inspect-passport-backend.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(pasaporte): registrar respuesta segura" || exit 0
          git push
