name: Fase 6B1 — Inventario Crear Citas

on:
  push:
    branches:
      - modularizacion-panel-fase6b1-crear-citas-2026-08-05
    paths:
      - MODULARIZACION_FASE6B1_TRIGGER.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventario-crear-citas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modularizacion-panel-fase6b1-crear-citas-2026-08-05
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirmar rama aislada
        run: |
          test "$(git branch --show-current)" = "modularizacion-panel-fase6b1-crear-citas-2026-08-05"
          git fetch origin modularizacion-panel-fase6a-agenda-2026-08-05
          git fetch origin main
      - name: Generar inventario focal
        run: node tools/inspect-appointment-create-phase6b1.mjs index.html
      - name: Guardar inventario solo en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MODULARIZACION_FASE6B1_INVENTARIO.md
          if git diff --cached --quiet; then
            echo "Inventario sin cambios."
          else
            git commit -m "Inventariar creación de citas para la Fase 6B1"
            git push origin HEAD:modularizacion-panel-fase6b1-crear-citas-2026-08-05
          fi
