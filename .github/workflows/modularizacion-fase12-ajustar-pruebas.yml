name: Fase 12 — Ajustar pruebas KPI

on:
  push:
    branches:
      - modularizacion-panel-fase12-indicadores-kpi-2026-08-05
    paths:
      - MODULARIZACION_FASE12_AJUSTAR_PRUEBAS.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ajustar-pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama aislada
        uses: actions/checkout@v4
        with:
          ref: modularizacion-panel-fase12-indicadores-kpi-2026-08-05
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirmar aislamiento
        run: test "$(git branch --show-current)" = "modularizacion-panel-fase12-indicadores-kpi-2026-08-05"

      - name: Ajustar únicamente la prueba
        run: |
          node tools/ajustar-pruebas-kpi-fase12.mjs
          node --check tools/validar-kpi-fase12.mjs
          git diff --exit-code -- js/modules/kpi.js index.html

      - name: Guardar ajuste de prueba
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/validar-kpi-fase12.mjs
          git commit -m "Ajustar comprobaciones QA del módulo KPI"
          git push origin HEAD:modularizacion-panel-fase12-indicadores-kpi-2026-08-05
