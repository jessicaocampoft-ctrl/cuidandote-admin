name: Cambiar etiquetas visibles de servicios v3

on:
  push:
    branches:
      - contenido-habilitacion-admin-2026-08-06

permissions:
  contents: write

jobs:
  actualizar-etiquetas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama aislada
        uses: actions/checkout@v4
        with:
          ref: contenido-habilitacion-admin-2026-08-06
          fetch-depth: 0

      - name: Ejecutar parche de etiquetas validado
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-service-labels-v2-2026-08-06.yml').read_text(encoding='utf-8')
          lines = workflow.splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          code_lines = lines[start:end]
          margin = min(len(line) - len(line.lstrip()) for line in code_lines if line.strip())
          code = '\n'.join(line[margin:] if line.strip() else '' for line in code_lines)
          exec(compile(code, '<parche-etiquetas-admin>', 'exec'), {})
          PY

      - name: Validar HTML, valores internos y alcance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re

          raw = Path('index.html').read_bytes()
          text = raw.decode('utf-8-sig')

          class Parser(HTMLParser):
              pass
          Parser().feed(text)

          required = [
              '<option value="Valoración Funcional">Valoración fisioterapéutica inicial</option>',
              '<option value="Readaptación Funcional">Rehabilitación y readaptación funcional</option>',
              '<option value="Readaptación">Rehabilitación y readaptación funcional</option>',
              "'Valoración Funcional':",
              "'Readaptación Funcional':",
              'Combo Diagnóstico Pro',
              'Paquete Readaptación Inicio',
              'Paquete Readaptación Avance',
              'Paquete Readaptación Total',
              'const _precios =',
              'const costosReales =',
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'Falta o se alteró contenido protegido: {needle}')

          forbidden = [
              'value="Valoración fisioterapéutica inicial"',
              'value="Rehabilitación y readaptación funcional"',
              '<<<<<<<',
              '>>>>>>>',
          ]
          for needle in forbidden:
              if needle in text:
                  raise SystemExit(f'Valor interno incorrecto o conflicto: {needle}')

          val_count = len(re.findall(r'<option\b[^>]*>\s*Valoración fisioterapéutica inicial\s*</option>', text, re.I))
          rehab_count = len(re.findall(r'<option\b[^>]*>\s*Rehabilitación y readaptación funcional\s*</option>', text, re.I))
          if val_count != 5 or rehab_count != 6:
              raise SystemExit(f'Conteo inesperado: valoración={val_count}, rehabilitación={rehab_count}')

          if not raw.startswith(b'\xef\xbb\xbf'):
              raise SystemExit('Se perdió la marca UTF-8 original del administrador')

          print('HTML válido; 5 etiquetas de valoración y 6 de rehabilitación verificadas.')
          PY
          git diff --stat

      - name: Guardar únicamente index.html en la rama aislada
        shell: bash
        run: |
          rm -f .github/workflows/apply-service-labels-2026-08-06.yml
          rm -f .github/workflows/apply-service-labels-v2-2026-08-06.yml
          rm -f .github/workflows/apply-service-labels-v3-2026-08-06.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-service-labels-2026-08-06.yml .github/workflows/apply-service-labels-v2-2026-08-06.yml .github/workflows/apply-service-labels-v3-2026-08-06.yml
          git commit -m "feat: actualizar etiquetas visibles de valoración y rehabilitación"
          git push origin HEAD:contenido-habilitacion-admin-2026-08-06
