name: Diagnóstico y prueba aislada del flujo de pagos

on:
  push:
    branches:
      - hotfix-pagos-2026-08-04

permissions:
  contents: write

concurrency:
  group: diagnostico-pagos-hotfix
  cancel-in-progress: false

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama hotfix
        uses: actions/checkout@v4
        with:
          ref: hotfix-pagos-2026-08-04

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Aplicar la corrección del botón de pagos
        run: node tools/fix-payment-submit.mjs index.html

      - name: Probar registro aprobación mensajes y recuperación
        run: node tools/test-payment-submit.mjs index.html

      - name: Extraer el flujo corregido para revisión
        run: node tools/extract-payment-flow.mjs index.html

      - name: Descargar el backend actual
        run: curl --fail --silent --show-error --location "https://raw.githubusercontent.com/jessicaocampoft-ctrl/jessicaocampoft-ctrl.github.io/main/google-apps-script.js" --output audit-backend.js

      - name: Verificar el contrato real del backend
        run: node tools/extract-backend-payment.mjs audit-backend.js

      - name: Guardar hotfix y resultados
        run: |
          if [ -z "$(git status --porcelain -- index.html PAYMENT_FLOW_CONTEXT.md PAYMENT_TEST_RESULT.md BACKEND_PAYMENT_CONTEXT.md)" ]; then
            echo "La corrección y los informes ya estaban guardados."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html PAYMENT_FLOW_CONTEXT.md PAYMENT_TEST_RESULT.md BACKEND_PAYMENT_CONTEXT.md
            git commit -m "Verificar el hotfix contra el backend de pagos"
            git push origin HEAD:hotfix-pagos-2026-08-04
          fi
