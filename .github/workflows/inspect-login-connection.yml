name: Inspect login connection

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-login-connection.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract login connection code
        shell: python
        run: |
          from pathlib import Path
          import re

          out = []
          for name in ('index.html', 'admin.html'):
            p = Path(name)
            if not p.exists():
              continue
            lines = p.read_text(encoding='utf-8-sig').splitlines()
            patterns = [
              r'APPS_SCRIPT_URL',
              r'Error de conexi[oó]n',
              r'Verificando',
              r'function\s+login',
              r'async\s+function\s+login',
              r'action=login',
              r'fetch\('
            ]
            hits = set()
            for i, line in enumerate(lines):
              if any(re.search(pat, line, re.I) for pat in patterns):
                for j in range(max(0, i-18), min(len(lines), i+45)):
                  hits.add(j)
            out.append(f'===== {name} =====')
            out.extend(f'{j+1}: {lines[j]}' for j in sorted(hits))
          Path('login-connection-diagnostics.txt').write_text('\n'.join(out)+'\n', encoding='utf-8')
      - name: Commit diagnostics and remove workflow
        run: |
          rm -f .github/workflows/inspect-login-connection.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(login): registrar diagnóstico de conexión" || exit 0
          git push
