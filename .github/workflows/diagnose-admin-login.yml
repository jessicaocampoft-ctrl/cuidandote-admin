name: Diagnose admin login

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-admin-login.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract login configuration safely
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8-sig')
          lines = text.splitlines()
          patterns = [
              r'APPS_SCRIPT_URL', r'function\s+doLogin', r'const\s+doLogin',
              r'Error de conexi[oó]n', r'action\s*[:=]\s*["\']?(?:login|auth)',
              r'loginAdmin', r'validarLogin', r'script\.google\.com/macros/s/'
          ]
          hits = set()
          for i, line in enumerate(lines):
              if any(re.search(p, line, re.I) for p in patterns):
                  for j in range(max(0, i-8), min(len(lines), i+18)):
                      hits.add(j)
          out = []
          for j in sorted(hits):
              line = lines[j]
              # Redact obvious passwords/tokens while preserving URLs and control flow.
              line = re.sub(r'((?:PASSWORD|PASS|PW|TOKEN|SECRET)\s*=\s*)["\'][^"\']*["\']', r'\1"[REDACTED]"', line, flags=re.I)
              out.append(f'{j+1}: {line}')
          Path('admin-login-diagnostics.txt').write_text('\n'.join(out) + '\n', encoding='utf-8')

      - name: Commit diagnostics and remove workflow
        run: |
          rm -f .github/workflows/diagnose-admin-login.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(login): registrar diagnóstico de conexión"
          git push
