name: Fase 6B2 — Inventario edición de citas

on:
  push:
    branches:
      - modularizacion-panel-fase6b2-editar-citas-2026-08-05
    paths:
      - MODULARIZACION_FASE6B2_TRIGGER.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventario-edicion-citas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama aislada
        uses: actions/checkout@v4
        with:
          ref: modularizacion-panel-fase6b2-editar-citas-2026-08-05
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirmar rama aislada
        run: test "$(git branch --show-current)" = "modularizacion-panel-fase6b2-editar-citas-2026-08-05"

      - name: Generar inventario
        run: node tools/inspect-appointment-edit-phase6b2.mjs index.html MODULARIZACION_FASE6B2_INVENTARIO.md

      - name: Guardar inventario solo en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MODULARIZACION_FASE6B2_INVENTARIO.md
          if git diff --cached --quiet; then
            echo "Inventario sin cambios."
          else
            git commit -m "Inventariar edición y estados de citas"
            git push origin HEAD:modularizacion-panel-fase6b2-editar-citas-2026-08-05
          fi
