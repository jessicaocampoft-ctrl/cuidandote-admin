name: Inspect admin login backend

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-admin-login-backend.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract admin login backend code
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('google-apps-script.js')
          text=p.read_text(encoding='utf-8-sig')
          lines=text.splitlines()
          hits=set()
          for i,line in enumerate(lines):
            if re.search(r'adminLogin|doGet\s*\(|doPost\s*\(',line,re.I):
              for j in range(max(0,i-35),min(len(lines),i+120)):
                hits.add(j)
          Path('admin-login-backend-diagnostics.txt').write_text('\n'.join(f'{j+1}: {lines[j]}' for j in sorted(hits))+'\n',encoding='utf-8')
      - name: Commit diagnostics and remove workflow
        run: |
          rm -f .github/workflows/inspect-admin-login-backend.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(login): registrar rutas del backend" || exit 0
          git push
