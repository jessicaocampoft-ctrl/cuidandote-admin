name: Test admin login GET

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-admin-login-backend.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test GET login route
        shell: bash
        run: |
          set -euo pipefail
          URL='https://script.google.com/macros/s/AKfycbwYxtpVLIb5DH31Bvh8UemIGZ08l1UEMuIJPbFPXOW_X0yX5J756IZKzmYx5PYOdPDC/exec?action=adminLogin&user=diagnostico&password=incorrecta'
          {
            echo '=== GET LOGIN ==='
            curl -sS -L -D /tmp/get-headers.txt -o /tmp/get-body.txt "$URL" || true
            cat /tmp/get-headers.txt
            echo '--- BODY ---'
            cat /tmp/get-body.txt
            echo
          } > admin-login-backend-diagnostics.txt 2>&1
      - name: Commit diagnostics and remove workflow
        run: |
          rm -f .github/workflows/inspect-admin-login-backend.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(login): registrar prueba GET del backend" || exit 0
          git push
