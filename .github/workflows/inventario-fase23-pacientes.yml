name: Inventario Fase 23 — Pacientes

on:
  push:
    branches:
      - modularizacion-panel-fase23-pacientes-historial-busqueda-2026-08-06
    paths:
      - tools/inventariar-pacientes-fase23.mjs
      - .github/workflows/inventario-fase23-pacientes.yml

permissions:
  contents: write

jobs:
  inventariar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama aislada
        uses: actions/checkout@v4
        with:
          ref: modularizacion-panel-fase23-pacientes-historial-busqueda-2026-08-06
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Confirmar base exacta
        run: |
          git fetch origin modularizacion-panel-fase22-comisiones-2026-08-06
          git merge-base --is-ancestor origin/modularizacion-panel-fase22-comisiones-2026-08-06 HEAD

      - name: Crear inventario
        run: node tools/inventariar-pacientes-fase23.mjs index.html INVENTARIO_FASE23_PACIENTES.md

      - name: Guardar inventario
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add INVENTARIO_FASE23_PACIENTES.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Inventariar pacientes, historial y búsqueda"
          git pull --rebase origin modularizacion-panel-fase23-pacientes-historial-busqueda-2026-08-06
          git push origin HEAD:modularizacion-panel-fase23-pacientes-historial-busqueda-2026-08-06
