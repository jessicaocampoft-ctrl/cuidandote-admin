name: Inventario Fase 25

on:
  push:
    branches:
      - modularizacion-panel-fase25-utilidades-integracion-final-2026-08-06
    paths:
      - INVENTARIAR_FASE25.md
      - .github/workflows/inventario-fase25.yml

permissions:
  contents: write

jobs:
  inventariar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama aislada
        uses: actions/checkout@v4
        with:
          ref: modularizacion-panel-fase25-utilidades-integracion-final-2026-08-06
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Confirmar base
        shell: bash
        run: |
          test "$(git branch --show-current)" = "modularizacion-panel-fase25-utilidades-integracion-final-2026-08-06"
          git fetch origin modularizacion-panel-fase24-emergencia-encuestas-perfil-accesibilidad-2026-08-06
          git merge-base --is-ancestor origin/modularizacion-panel-fase24-emergencia-encuestas-perfil-accesibilidad-2026-08-06 HEAD

      - name: Inventariar
        run: node tools/inventariar-fase25.mjs index.html

      - name: Guardar inventario
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add INVENTARIO_FASE25.md
          git commit -m "Inventariar utilidades compartidas de la Fase 25"
          git pull --rebase origin modularizacion-panel-fase25-utilidades-integracion-final-2026-08-06
          git push origin HEAD:modularizacion-panel-fase25-utilidades-integracion-final-2026-08-06
