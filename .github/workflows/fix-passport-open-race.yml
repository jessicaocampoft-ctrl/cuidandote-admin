name: Fix passport open race

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-passport-open-race.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make passport generation and opening atomic
        shell: python
        run: |
          from pathlib import Path
          import re

          select_new = r'''async function selectPasPatient(p) {
            document.getElementById('pasNombreInput').value = p.nombre;
            document.getElementById('pasDropdown').style.display = 'none';
            _pasTelefono  = (p.telefono || '').replace(/\D/g, '');
            _pasConfirmado = true;
            _pasSetConfirmed(true, p);

            const btn = document.getElementById('pasAbrirBtn');
            if (btn) {
              btn.disabled = true;
              btn.textContent = 'Generando enlace...';
              btn.style.cursor = 'wait';
            }
            try {
              await generarLinkPasaporte();
            } finally {
              if (btn) {
                btn.disabled = false;
                btn.textContent = 'Abrir y editar →';
                btn.style.cursor = 'pointer';
              }
            }
          }

          function _pasSetConfirmed'''

          open_new = r'''async function abrirPasaporte() {
            if (!_pasConfirmado) {
              toast('Selecciona un paciente de la lista primero', 'warn');
              return;
            }

            let link = (_pasCurrent && _pasCurrent.link) || document.getElementById('pasLinkTexto').textContent;
            let popup = null;

            if (!link) {
              const btn = document.getElementById('pasAbrirBtn');
              popup = window.open('', '_blank');
              if (btn) {
                btn.disabled = true;
                btn.textContent = 'Generando enlace...';
                btn.style.cursor = 'wait';
              }
              try {
                await generarLinkPasaporte();
              } catch (error) {
                toast('No se pudo generar el enlace seguro', 'error');
              } finally {
                if (btn) {
                  btn.disabled = false;
                  btn.textContent = 'Abrir y editar →';
                  btn.style.cursor = 'pointer';
                }
              }
              link = (_pasCurrent && _pasCurrent.link) || document.getElementById('pasLinkTexto').textContent;
            }

            if (!link) {
              if (popup && !popup.closed) popup.close();
              return;
            }

            if (popup && !popup.closed) popup.location.replace(link);
            else window.open(link, '_blank');
          }

          function copiarLinkPas'''

          changed = []
          for name in ('index.html', 'admin.html'):
            path = Path(name)
            if not path.exists():
              continue
            text = path.read_text(encoding='utf-8-sig')
            text, n1 = re.subn(
              r'function selectPasPatient\(p\) \{.*?\n\}\n\nfunction _pasSetConfirmed',
              lambda match: select_new,
              text,
              count=1,
              flags=re.S
            )
            text, n2 = re.subn(
              r'function abrirPasaporte\(\) \{.*?\n\}\n\nfunction copiarLinkPas',
              lambda match: open_new,
              text,
              count=1,
              flags=re.S
            )
            if n1 != 1 or n2 != 1:
              raise SystemExit(f'{name}: expected one select and one open function, got {n1}, {n2}')
            if 'async function abrirPasaporte()' not in text or "btn.textContent = 'Generando enlace...'" not in text:
              raise SystemExit(f'{name}: new atomic flow validation failed')
            path.write_text(text, encoding='utf-8')
            changed.append(name)

          if not changed:
            raise SystemExit('No admin files found')
          print('Updated:', ', '.join(changed))

      - name: Clean diagnostics and commit fix
        run: |
          rm -f .github/workflows/fix-passport-open-race.yml
          rm -f passport-ui-diagnostics.txt passport-backend-diagnostics.txt passport-symbols-diagnostics.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(pasaporte): esperar enlace seguro antes de abrir"
          git push
