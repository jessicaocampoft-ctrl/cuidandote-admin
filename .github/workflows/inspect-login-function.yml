name: Inspect login function

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-login-function.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract login function
        shell: python
        run: |
          from pathlib import Path
          import re
          out=[]
          for name in ('index.html','admin.html'):
            p=Path(name)
            if not p.exists():
              continue
            text=p.read_text(encoding='utf-8-sig')
            m=re.search(r'async function doLogin\(\) \{.*?\n\}', text, re.S)
            out.append('===== '+name+' =====')
            out.append(m.group(0) if m else 'NOT FOUND')
          Path('login-function-diagnostics.txt').write_text('\n\n'.join(out)+'\n',encoding='utf-8')
      - name: Commit diagnostics and remove workflow
        run: |
          rm -f .github/workflows/inspect-login-function.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(login): registrar función de ingreso" || exit 0
          git push
