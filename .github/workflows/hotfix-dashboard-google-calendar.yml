name: Validar hotfix dashboard y Google Calendar

on:
  push:
    branches:
      - hotfix-dashboard-google-calendar-2026-09-03
    paths:
      - .github/workflows/hotfix-dashboard-google-calendar.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Aplicar hotfix quirúrgico
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64

          sidebar_path = Path('js/modules/sidebar-management.js')
          sidebar = sidebar_path.read_text(encoding='utf-8')

          old_primary = "const PRIMARY_IDS = ['sb-dashboard','sb-agenda','sb-pacientes','sb-pagos','sb-seguimiento','sb-pasaporte'];"
          new_primary = "const PRIMARY_IDS = ['sb-calendario','sb-dashboard','sb-agenda','sb-pacientes','sb-pagos','sb-seguimiento','sb-pasaporte'];"
          if sidebar.count(old_primary) != 1:
              raise SystemExit('No se encontró exactamente una definición PRIMARY_IDS esperada')
          sidebar = sidebar.replace(old_primary, new_primary, 1)

          old_tools = "{ id:'tools', label:'Herramientas', items:['sb-calendario','sb-evaluacion','sb-evalexpress'] }"
          new_tools = "{ id:'tools', label:'Herramientas', items:['sb-evaluacion','sb-evalexpress'] }"
          if sidebar.count(old_tools) != 1:
              raise SystemExit('No se encontró exactamente el grupo Herramientas esperado')
          sidebar = sidebar.replace(old_tools, new_tools, 1)

          marker = "  function initSidebarManagement() {\n"
          if sidebar.count(marker) != 1:
              raise SystemExit('No se encontró el punto de inserción de recuperación del dashboard')

          recovery = base64.b64decode('').decode('utf-8')
          sidebar = sidebar.replace(marker, recovery + marker, 1)

          old_ready = "    sidebar.dataset.managementOrganized = '1';\n    return true;"
          new_ready = "    sidebar.dataset.managementOrganized = '1';\n    _installDashboardRecovery();\n    return true;"
          if sidebar.count(old_ready) != 1:
              raise SystemExit('No se encontró el cierre esperado de initSidebarManagement')
          sidebar = sidebar.replace(old_ready, new_ready, 1)
          sidebar_path.write_text(sidebar, encoding='utf-8')

          profile_path = Path('js/modules/admin-profile-accessibility.js')
          profile = profile_path.read_text(encoding='utf-8')
          old_mobile = "['mobBtn-calendario','mobBtn-finanzas'].forEach(id => {"
          new_mobile = "['mobBtn-finanzas'].forEach(id => {"
          if profile.count(old_mobile) != 1:
              raise SystemExit('No se encontró la simplificación móvil esperada')
          profile = profile.replace(old_mobile, new_mobile, 1)
          profile_path.write_text(profile, encoding='utf-8')
          PY

      - name: Validar sintaxis y alcance
        shell: bash
        run: |
          set -euo pipefail
          node --check js/modules/sidebar-management.js
          node --check js/modules/admin-profile-accessibility.js
          python - <<'PY'
          from pathlib import Path
          s = Path('js/modules/sidebar-management.js').read_text(encoding='utf-8')
          p = Path('js/modules/admin-profile-accessibility.js').read_text(encoding='utf-8')
          assert "const PRIMARY_IDS = ['sb-calendario','sb-dashboard'" in s
          assert "items:['sb-evaluacion','sb-evalexpress']" in s
          assert "items:['sb-calendario','sb-evaluacion','sb-evalexpress']" not in s
          assert '_installDashboardRecovery();' in s
          assert 'Dashboard recovery: initDashboard falló' in s
          assert "['mobBtn-finanzas'].forEach" in p
          assert "['mobBtn-calendario','mobBtn-finanzas'].forEach" not in p
          print('Hotfix validado: sintaxis OK, Google Calendar primero y recuperación del dashboard instalada.')
          PY

      - name: Guardar hotfix y retirar workflow temporal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/hotfix-dashboard-google-calendar.yml
          git add js/modules/sidebar-management.js js/modules/admin-profile-accessibility.js
          git commit -m "fix: recuperar dashboard y priorizar Google Calendar"
          git push
