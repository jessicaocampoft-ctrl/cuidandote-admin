name: Browser test admin login

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/browser-test-admin-login.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser
        run: |
          npm install playwright@1.55.0 --no-save
          npx playwright install chromium

      - name: Reproduce invalid login in browser
        shell: bash
        run: |
          cat > /tmp/test-login.js <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const out = [];
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage();
            page.on('console', m => out.push('CONSOLE=' + m.type() + ':' + m.text()));
            page.on('requestfailed', r => out.push('REQUEST_FAILED=' + r.url() + ' :: ' + (r.failure()?.errorText || '')));
            page.on('response', r => {
              if (r.url().includes('script.google.com') || r.url().includes('googleusercontent.com')) {
                out.push('RESPONSE=' + r.status() + ' ' + r.url());
              }
            });
            try {
              await page.goto('https://admin.cuidandotefisioterapia.com/', {waitUntil:'networkidle', timeout:60000});
              out.push('PAGE_URL=' + page.url());
              out.push('TITLE=' + await page.title());
              await page.locator('#userInput').fill('');
              await page.locator('#pwInput').fill('__INVALID_BROWSER_TEST__');
              await page.locator('#loginBtn').click();
              await page.waitForTimeout(6000);
              out.push('LOGIN_ERR=' + await page.locator('#loginErr').innerText().catch(() => 'MISSING'));
              out.push('LOGIN_ERR_DISPLAY=' + await page.locator('#loginErr').evaluate(el => getComputedStyle(el).display).catch(() => 'MISSING'));
            } catch (e) {
              out.push('TEST_ERROR=' + e.message);
            }
            await browser.close();
            require('fs').writeFileSync('admin-browser-test.txt', out.join('\n') + '\n');
          })();
          NODE
          node /tmp/test-login.js

      - name: Commit result and remove workflow
        run: |
          rm -rf node_modules package-lock.json package.json
          rm -f .github/workflows/browser-test-admin-login.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(login): registrar prueba en navegador"
          git push
