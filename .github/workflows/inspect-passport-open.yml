name: Inspect passport open flow

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-passport-open.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract passport UI flow
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('index.html')
          text = path.read_text(encoding='utf-8-sig')
          lines = text.splitlines()
          patterns = [
            r'Genera primero el enlace seguro',
            r'passportEnsure',
            r'Abrir y editar',
            r'abrir.*pasaporte',
            r'generar.*enlace.*seguro',
            r'passportSecure',
            r'pasaporte.*url'
          ]
          hits=set()
          for i,line in enumerate(lines):
            if any(re.search(p,line,re.I) for p in patterns):
              for j in range(max(0,i-45), min(len(lines),i+90)):
                hits.add(j)
          out=[]
          for j in sorted(hits):
            out.append(f'{j+1}: {lines[j]}')
          Path('passport-ui-diagnostics.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')

      - name: Commit diagnostics and remove workflow
        run: |
          rm -f .github/workflows/inspect-passport-open.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(pasaporte): registrar flujo de apertura" || exit 0
          git push
