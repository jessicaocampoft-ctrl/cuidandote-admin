name: Test admin endpoints browser-like

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-admin-endpoints-browserlike.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test endpoints like browser fetch
        shell: bash
        run: |
          set +e
          OUT="admin-endpoint-browserlike-test.txt"
          : > "$OUT"
          test_endpoint() {
            NAME="$1"
            URL="$2"
            BODY_FILE="/tmp/${NAME}.body"
            HEADER_FILE="/tmp/${NAME}.headers"
            CODE=$(curl -L -sS --max-time 35 -D "$HEADER_FILE" -o "$BODY_FILE" -w '%{http_code}' \
              -H 'Content-Type: text/plain;charset=utf-8' \
              -H 'Origin: https://admin.cuidandotefisioterapia.com' \
              --data '{"action":"adminLogin","user":"","password":"__INVALID_TEST_ONLY__"}' \
              "$URL")
            RC=$?
            CT=$(grep -i '^content-type:' "$HEADER_FILE" | tail -1 | tr -d '\r' | cut -d: -f2- | xargs)
            ACAO=$(grep -i '^access-control-allow-origin:' "$HEADER_FILE" | tail -1 | tr -d '\r' | cut -d: -f2- | xargs)
            BODY=$(head -c 800 "$BODY_FILE" | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g')
            printf '%s_HTTP=%s\n%s_CURL_RC=%s\n%s_CONTENT_TYPE=%s\n%s_ACAO=%s\n%s_BODY=%s\n\n' "$NAME" "$CODE" "$NAME" "$RC" "$NAME" "$CT" "$NAME" "$ACAO" "$NAME" "$BODY" >> "$OUT"
          }
          test_endpoint CURRENT 'https://script.google.com/macros/s/AKfycbzFlqrTerVorQDn0_u_D29rh3cTRstc1XBxYDAn5-2YyexMSpip0m2RPcjzJMK7VDjd/exec'
          test_endpoint ADMIN_NEW 'https://script.google.com/macros/s/AKfycbwYxtpVLIb5DH31Bvh8UemIGZ08l1UEMuIJPbFPXOW_X0yX5J756IZKzmYx5PYOdPDC/exec'
          test_endpoint PUBLIC 'https://script.google.com/macros/s/AKfycbwPE46Z_7mnCPTE7KcthlluGXsuqwAofVBHS0jGXv7C8ekLpmPzHu5x0jFYB7yxEquw/exec'

      - name: Commit test result and remove workflow
        run: |
          rm -f .github/workflows/test-admin-endpoints-browserlike.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(login): registrar prueba real de endpoints"
          git push
