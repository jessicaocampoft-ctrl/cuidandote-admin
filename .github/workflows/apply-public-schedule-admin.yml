name: Validar módulo Horarios públicos

on:
  push:
    branches:
      - horarios-publicos-admin-2026-08-07
    paths:
      - .github/public-schedule-admin-trigger.txt

permissions:
  contents: write

concurrency:
  group: public-schedule-admin-2026-08-07
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama aislada
        uses: actions/checkout@v4
        with:
          ref: horarios-publicos-admin-2026-08-07
          fetch-depth: 0

      - name: Conectar módulo al administrador
        run: python .github/apply_public_schedule_admin.py

      - name: Validar sintaxis e integraciones
        run: |
          set -euo pipefail
          node --check public-schedule-admin.js
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8-sig')
          module = Path('public-schedule-admin.js').read_text(encoding='utf-8')
          html_required = [
              'public-schedule-admin.js',
              "action: 'adminLogin'",
              'TOKEN = d.sessionToken',
              'passportSaveProgress',
              'saveManualPayment',
              'function showView(v)',
              'id="sb-bloquear"'
          ]
          module_required = [
              'savePublicScheduleConfig',
              'publicScheduleConfig',
              'Sede Campestre Recovery',
              'Valoración Funcional',
              'Readaptación Funcional',
              "SERVICES = {",
              "recovery: ["
          ]
          missing = [x for x in html_required if x not in html] + [x for x in module_required if x not in module]
          if missing:
              raise SystemExit('Faltan validaciones: ' + ' | '.join(missing))
          print('Integraciones críticas y restricciones de sede verificadas.')
          PY

      - name: Verificar backend desplegado usado por admin
        run: |
          set -euo pipefail
          url='https://script.google.com/macros/s/AKfycbx7biQkVS9l1nU4AYQeOmQzbPcKebOUJ5UmX97vCJDaXg5s-9y0-mgSrE0ANZXZJ8Hd/exec?action=publicScheduleConfig'
          response="$(curl --fail --silent --show-error --location "$url")"
          printf '%s' "$response" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'
          printf '%s' "$response" | grep -q 'Sede Santa Mónica'
          printf '%s' "$response" | grep -q 'Sede Campestre Recovery'

      - name: Guardar resultado limpio
        run: |
          set -euo pipefail
          rm -f .github/apply_public_schedule_admin.py
          rm -f .github/public-schedule-admin-trigger.txt
          rm -f .github/workflows/apply-public-schedule-admin.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: administrar horarios públicos por sede"
          git push origin HEAD:horarios-publicos-admin-2026-08-07
