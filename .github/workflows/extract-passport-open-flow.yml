name: Extract passport open flow

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-passport-open-flow.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract relevant snippets
        shell: python
        run: |
          from pathlib import Path
          import re

          out=[]
          for name in ('index.html','admin.html'):
            p=Path(name)
            if not p.exists():
              continue
            text=p.read_text(encoding='utf-8-sig')
            lines=text.splitlines()
            hits=set()
            patterns=[r'about:blank',r'window\.open',r'Abrir y editar',r'Genera primero el enlace seguro',r'abrirPasaporte',r'passportEnsure']
            for i,line in enumerate(lines):
              if any(re.search(pt,line,re.I) for pt in patterns):
                hits.add(i)
            out.append(f'===== {name} =====')
            for i in sorted(hits):
              a=max(0,i-12); b=min(len(lines),i+18)
              out.append(f'--- lines {a+1}-{b} ---')
              for n in range(a,b):
                out.append(f'{n+1:05d}: {lines[n]}')
          Path('passport-open-flow.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
      - name: Commit result and remove workflow
        run: |
          rm -f .github/workflows/extract-passport-open-flow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(pasaporte): registrar flujo de apertura"
          git push
