name: Validar menú Gestión

on:
  push:
    branches:
      - simplificacion-panel-fase12-menu-gestion-2026-08-08
    paths:
      - .github/validar-menu-gestion-trigger.txt

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: simplificacion-panel-fase12-menu-gestion-2026-08-08
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar sintaxis
        run: |
          set -euo pipefail
          node --check js/modules/sidebar-management.js
          node --check js/modules/admin-profile-accessibility.js

      - name: Validar contratos de navegación
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const nav = fs.readFileSync('js/modules/sidebar-management.js','utf8');
          const profile = fs.readFileSync('js/modules/admin-profile-accessibility.js','utf8');
          function ok(v,m){ if(!v) throw new Error(m); }
          ['sb-dashboard','sb-agenda','sb-pacientes','sb-pagos','sb-seguimiento','sb-pasaporte'].forEach(id => ok(nav.includes(id), 'Falta principal '+id));
          ['Finanzas','Operación','Comercial','Equipo','Comunicación','Herramientas'].forEach(label => ok(nav.includes(label), 'Falta grupo '+label));
          ['sb-tareas','sb-basedatos','sb-recordatorios','sb-guioneswa','sb-recuperacion','sb-guiakpis','sb-presupuesto','sb-comisiones','sb-acciones'].forEach(id => ok(nav.includes(id), 'Falta retiro legado '+id));
          ok(nav.includes("_setSimpleLabel('sb-dashboard','Inicio')"), 'Dashboard no se renombra a Inicio');
          ok(nav.includes("_setSimpleLabel('sb-finanzas','Gestión financiera')"), 'Finanzas no se renombra');
          ok(profile.includes("script.src = 'js/modules/sidebar-management.js'"), 'Falta cargador del módulo');
          ok(profile.includes('_initSidebarManagementModule();'), 'Falta inicialización del módulo');
          ok(!/\bfetch\s*\(/.test(nav), 'El menú no debe llamar fetch');
          ok(!nav.includes('APPS_SCRIPT_URL'), 'El menú no debe tocar Apps Script');
          console.log('Contratos del menú verificados.');
          NODE

      - name: Confirmar aislamiento
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --exit-code origin/main -- index.html google-apps-script.js public-schedule-admin.js
          changed=$(git diff --name-only origin/main -- 'js/**/*.js' | sort)
          expected=$(printf '%s\n' js/modules/admin-profile-accessibility.js js/modules/sidebar-management.js | sort)
          printf '%s\n' "$changed"
          test "$changed" = "$expected"
