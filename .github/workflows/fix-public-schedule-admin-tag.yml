name: Corregir carga final Horarios públicos

on:
  push:
    branches:
      - horarios-publicos-admin-2026-08-07
    paths:
      - .github/fix-public-schedule-admin-trigger.txt

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: horarios-publicos-admin-2026-08-07
          fetch-depth: 0

      - name: Corregir posición del script
        run: python .github/fix_public_schedule_admin_tag.py

      - name: Validar documento final
        run: |
          set -euo pipefail
          node --check public-schedule-admin.js
          python - <<'PY'
          from pathlib import Path
          t = Path('index.html').read_text(encoding='utf-8-sig')
          tag = '<script src="public-schedule-admin.js?v=20260807-1"></script>'
          assert t.count(tag) == 1
          after = t[t.rfind(tag) + len(tag):].strip()
          assert after.startswith('</body>')
          assert t.rfind(tag) > len(t) - 500
          assert 'Reporte automático de indicadores de gestión' in t
          assert 'w.document.close();' in t
          print('Carga final del módulo validada.')
          PY

      - name: Limpiar temporales y guardar
        run: |
          set -euo pipefail
          rm -f .github/fix_public_schedule_admin_tag.py
          rm -f .github/fix-public-schedule-admin-trigger.txt
          rm -f .github/workflows/fix-public-schedule-admin-tag.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: cargar horarios públicos al final del administrador"
          git push origin HEAD:horarios-publicos-admin-2026-08-07
