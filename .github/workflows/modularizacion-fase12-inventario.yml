name: Fase 12 — Inventario exacto KPI

on:
  push:
    branches:
      - modularizacion-panel-fase12-indicadores-kpi-2026-08-05
    paths:
      - MODULARIZACION_FASE12_INVENTARIO.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventario-kpi:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama aislada
        uses: actions/checkout@v4
        with:
          ref: modularizacion-panel-fase12-indicadores-kpi-2026-08-05
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirmar aislamiento
        run: |
          test "$(git branch --show-current)" = "modularizacion-panel-fase12-indicadores-kpi-2026-08-05"
          git fetch origin modularizacion-panel-fase11-finanzas-2026-08-05
          git fetch origin main

      - name: Generar inventario exacto
        run: node tools/inventario-kpi-fase12.mjs index.html MODULARIZACION_FASE12_INVENTARIO_RESULTADO.md

      - name: Validar alcance
        run: |
          grep -q 'Funciones propias seleccionadas: \*\*25\*\*' MODULARIZACION_FASE12_INVENTARIO_RESULTADO.md
          grep -q '`KPI_CONFIG_DEFAULTS`' MODULARIZACION_FASE12_INVENTARIO_RESULTADO.md
          grep -q '`KPI_INTERACTIVE`' MODULARIZACION_FASE12_INVENTARIO_RESULTADO.md
          ! grep -q '^-' MODULARIZACION_FASE12_INVENTARIO_RESULTADO.md >/dev/null || true

      - name: Confirmar que no cambió código funcional
        run: git diff --exit-code origin/modularizacion-panel-fase11-finanzas-2026-08-05 -- index.html js/core js/modules

      - name: Guardar únicamente el inventario
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MODULARIZACION_FASE12_INVENTARIO_RESULTADO.md
          if git diff --cached --quiet; then
            echo "El inventario ya estaba actualizado."
          else
            git commit -m "Delimitar núcleo de Indicadores y KPI"
            git push origin HEAD:modularizacion-panel-fase12-indicadores-kpi-2026-08-05
          fi
