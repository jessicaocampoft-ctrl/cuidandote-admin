name: Modularización segura — Fase 5 Pasaporte

on:
  push:
    branches:
      - modularizacion-panel-fase5-pasaporte-2026-08-05
    paths:
      - MODULARIZACION_FASE5.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modularizacion-panel-fase5-pasaporte
  cancel-in-progress: false

jobs:
  inventario-pasaporte:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama aislada
        uses: actions/checkout@v4
        with:
          ref: modularizacion-panel-fase5-pasaporte-2026-08-05
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirmar aislamiento respecto a producción
        run: |
          test "$(git branch --show-current)" = "modularizacion-panel-fase5-pasaporte-2026-08-05"
          git fetch origin modularizacion-panel-fase4-pagos-2026-08-05
          git fetch origin main

      - name: Inventariar módulo de Pasaporte
        run: node tools/inspect-passport-phase5.mjs index.html

      - name: Guardar inventario solo en la rama aislada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MODULARIZACION_FASE5_INVENTARIO.md
          if git diff --cached --quiet; then
            echo "El inventario ya estaba actualizado."
          else
            git commit -m "Inventariar funciones y acciones del Pasaporte"
            git push origin HEAD:modularizacion-panel-fase5-pasaporte-2026-08-05
          fi

      - name: Resumen
        run: |
          echo "INVENTARIO DE FASE 5 COMPLETADO"
          echo "No se modificó main ni la lógica publicada del panel."
