name: Modularización segura — Fase 1

on:
  push:
    branches:
      - modularizacion-panel-fase1-2026-08-04
    paths:
      - MODULARIZACION_FASE1.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modularizacion-panel-fase1
  cancel-in-progress: false

jobs:
  separar-navegacion:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama aislada
        uses: actions/checkout@v4
        with:
          ref: modularizacion-panel-fase1-2026-08-04
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirmar que producción no será modificada
        run: |
          test "$(git branch --show-current)" = "modularizacion-panel-fase1-2026-08-04"
          git fetch origin main

      - name: Separar únicamente la navegación
        run: node tools/modularizar-navegacion.mjs index.html js/core/navigation.js

      - name: Validar sintaxis del módulo
        run: node --check js/core/navigation.js

      - name: Validar contrato y aislamiento
        run: node tools/validar-modularizacion-fase1.mjs

      - name: Recorrer todas las vistas del menú en entorno aislado
        run: node tools/probar-navegacion-modular.mjs

      - name: Confirmar que no aparecieron cambios funcionales inesperados
        run: |
          INESPERADOS="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(index.html|js/core/navigation.js)$' || true)"
          if [ -n "$INESPERADOS" ]; then
            echo "Archivos inesperados:"
            echo "$INESPERADOS"
            exit 1
          fi
          test -f js/core/navigation.js

      - name: Guardar resultado únicamente en la rama aislada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/core/navigation.js
          if git diff --cached --quiet; then
            echo "La navegación ya estaba modularizada y no requirió cambios adicionales."
          else
            git commit -m "Modularizar navegación del panel sin cambiar su comportamiento"
            git push origin HEAD:modularizacion-panel-fase1-2026-08-04
          fi

      - name: Resumen
        run: |
          echo "FASE 1 COMPLETADA EN RAMA AISLADA"
          echo "Navegación probada en todas las vistas."
          echo "No se publicó ningún cambio en main."
