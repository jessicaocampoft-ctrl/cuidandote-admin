name: Fase 16 — Ingresos y análisis

on:
  push:
    branches:
      - modularizacion-panel-fase16-ingresos-analisis-2026-08-06
    paths:
      - MODULARIZACION_FASE16_INGRESOS.md
      - .github/workflows/modularizacion-fase16-ingresos.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modularizacion-panel-fase16-ingresos-analisis
  cancel-in-progress: false

jobs:
  modularizar-ingresos:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama aislada
        uses: actions/checkout@v4
        with:
          ref: modularizacion-panel-fase16-ingresos-analisis-2026-08-06
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirmar aislamiento y base
        run: |
          test "$(git branch --show-current)" = "modularizacion-panel-fase16-ingresos-analisis-2026-08-06"
          git fetch origin modularizacion-panel-fase15-metricas-inteligentes-2026-08-06
          git fetch origin main
          git merge-base --is-ancestor origin/modularizacion-panel-fase15-metricas-inteligentes-2026-08-06 HEAD
          git show origin/modularizacion-panel-fase15-metricas-inteligentes-2026-08-06:index.html > /tmp/fase15-index.html

      - name: Separar Ingresos y análisis
        run: node tools/modularizar-ingresos-fase16.mjs index.html

      - name: Validar sintaxis y paridad
        run: |
          node --check tools/modularizar-ingresos-fase16.mjs
          node --check tools/validar-ingresos-fase16.mjs
          node --check js/modules/income-analysis.js
          node tools/validar-ingresos-fase16.mjs /tmp/fase15-index.html index.html js/modules/income-analysis.js

      - name: Confirmar módulos anteriores
        run: |
          for f in js/core/*.js js/modules/*.js; do
            node --check "$f"
          done
          test -f js/modules/monthly-report.js
          test -f js/modules/smart-metrics.js
          test -f js/modules/budget.js
          test -f js/modules/kpi.js
          test -f js/modules/finance.js

      - name: Confirmar aislamiento funcional
        run: |
          test "$(git rev-parse origin/main)" = "$(git rev-parse origin/main)"
          ! git diff --name-only origin/modularizacion-panel-fase15-metricas-inteligentes-2026-08-06 -- google-apps-script.js | grep -q .
          ! git diff --name-only origin/modularizacion-panel-fase15-metricas-inteligentes-2026-08-06 -- appsscript.json | grep -q .
          test "$(grep -c 'js/modules/income-analysis.js' index.html)" -eq 1

      - name: Generar informe final
        run: |
          cat > MODULARIZACION_FASE16_RESULTADO.md <<'EOF'
          # Fase 16 — Ingresos y análisis financiero detallado

          - Nuevo módulo: `js/modules/income-analysis.js`.
          - Funciones trasladadas: 9.
          - Estado compartido conservado en `index.html`: `_modoIngresos`.
          - Adaptadores públicos conservados: 9.
          - Modos validados: día, semana y mes.
          - Análisis validados: resumen de citas, detalle de ingresos, semanal y mensual.
          - Paridad exacta con la Fase 15: sí.
          - Nuevas llamadas a Apps Script: ninguna.
          - `main`, Apps Script y panel publicado: sin cambios.
          - Resultado automático: correcto.
          EOF

      - name: Guardar resultado solo en la rama aislada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/modules/income-analysis.js MODULARIZACION_FASE16_RESULTADO.md
          if git diff --cached --quiet; then
            echo "La Fase 16 ya estaba actualizada."
          else
            git commit -m "Separar y validar Ingresos y análisis"
            git push origin HEAD:modularizacion-panel-fase16-ingresos-analisis-2026-08-06
          fi
