name: Fix login resilience

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-login-resilience.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden admin login request
        shell: python
        run: |
          from pathlib import Path

          new_function = r'''async function doLogin() {
            const ahora = Date.now();
            if (_loginLockedUntil > ahora) {
              const segs = Math.ceil((_loginLockedUntil - ahora) / 1000);
              const errEl = document.getElementById('loginErr');
              errEl.textContent = `Demasiados intentos. Espera ${segs} segundo${segs !== 1 ? 's' : ''}.`;
              errEl.style.display = 'block';
              return;
            }

            const pw = document.getElementById('pwInput').value.trim();
            const user = (document.getElementById('userInput')?.value || '').trim();
            const btn = document.getElementById('loginBtn');
            const errEl = document.getElementById('loginErr');
            if (!pw) return;

            errEl.textContent = '';
            errEl.style.display = 'none';
            btn.textContent = 'Verificando...';
            btn.disabled = true;

            try {
              let d = null;
              let lastError = null;

              for (let intento = 1; intento <= 2; intento++) {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 20000);
                try {
                  const separator = APPS_SCRIPT_URL.includes('?') ? '&' : '?';
                  const loginUrl = APPS_SCRIPT_URL + separator + '_login=' + Date.now() + '-' + intento;
                  const r = await fetch(loginUrl, {
                    method: 'POST',
                    mode: 'cors',
                    credentials: 'omit',
                    cache: 'no-store',
                    redirect: 'follow',
                    referrerPolicy: 'no-referrer',
                    headers: {'Content-Type': 'text/plain;charset=UTF-8'},
                    body: JSON.stringify({action: 'adminLogin', user, password: pw}),
                    signal: controller.signal
                  });
                  const raw = (await r.text()).replace(/^\uFEFF/, '').trim();
                  if (!raw) throw new Error('El servidor respondió vacío');
                  try {
                    d = JSON.parse(raw);
                  } catch (parseError) {
                    throw new Error('Respuesta inválida del servidor (' + r.status + ')');
                  }
                  break;
                } catch (requestError) {
                  lastError = requestError;
                  if (intento < 2) await new Promise(resolve => setTimeout(resolve, 700));
                } finally {
                  clearTimeout(timeout);
                }
              }

              if (!d) throw lastError || new Error('No se recibió respuesta del servidor');

              if (d.ok) {
                _loginAttempts = 0;
                TOKEN = d.sessionToken;
                sessionStorage.setItem('adminToken', d.sessionToken);
                _loginTime = Date.now();
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminApp').style.display = 'block';
                allData = d;
                await loadAdminKV();
                await loadTeamData();
                await limpiarHorariosInvalidosAuto();
                reloadMetas();
                _initSidebarState();
                initDashboard();
                await _runUrlRepairIfRequested();
              } else {
                _loginAttempts++;
                if (_loginAttempts >= 5) {
                  _loginLockedUntil = Date.now() + 120000;
                  _loginAttempts = 0;
                  errEl.textContent = 'Demasiados intentos fallidos. Acceso bloqueado por 2 minutos.';
                } else {
                  const restantes = 5 - _loginAttempts;
                  errEl.textContent = (d.error || 'Credenciales incorrectas') + `. Intentos restantes: ${restantes}`;
                }
                errEl.style.display = 'block';
              }
            } catch (e) {
              console.error('Fallo de conexión durante adminLogin:', e);
              errEl.textContent = e && e.name === 'AbortError'
                ? 'El servidor tardó demasiado. Intenta nuevamente.'
                : 'No fue posible conectar con el servidor. Intenta nuevamente.';
              errEl.style.display = 'block';
            } finally {
              btn.textContent = 'Ingresar';
              btn.disabled = false;
            }
          }'''

          changed=[]
          for name in ('index.html','admin.html'):
            path=Path(name)
            if not path.exists():
              continue
            text=path.read_text(encoding='utf-8-sig')
            start=text.find('async function doLogin() {')
            if start < 0:
              raise SystemExit(f'{name}: doLogin not found')
            end=text.find('\n}\n', start)
            if end < 0:
              raise SystemExit(f'{name}: doLogin end not found')
            end += 2
            updated=text[:start]+new_function+text[end:]
            if updated.count('async function doLogin() {') != 1:
              raise SystemExit(f'{name}: unexpected doLogin count')
            if "headers: {'Content-Type': 'text/plain;charset=UTF-8'}" not in updated:
              raise SystemExit(f'{name}: resilient request missing')
            path.write_text(updated,encoding='utf-8')
            changed.append(name)
          print('Updated:', ', '.join(changed))
      - name: Clean diagnostics and commit fix
        run: |
          rm -f .github/workflows/fix-login-resilience.yml
          rm -f .github/workflows/browser-reproduce-login.yml
          rm -f login-connection-diagnostics.txt login-function-diagnostics.txt login-endpoint-diagnostics.txt live-admin-diagnostics.txt admin-login-backend-diagnostics.txt browser-login-diagnostics.txt
          rm -rf node_modules package-lock.json package.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(login): reintentar conexión y evitar bloqueo" || exit 0
          git push
