name: Modularización segura — Fase 2 API

on:
  push:
    branches:
      - modularizacion-panel-fase2-api-2026-08-05
    paths:
      - MODULARIZACION_FASE2.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modularizacion-panel-fase2-api
  cancel-in-progress: false

jobs:
  modularizar-api:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama aislada
        uses: actions/checkout@v4
        with:
          ref: modularizacion-panel-fase2-api-2026-08-05
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirmar aislamiento respecto a producción
        run: |
          test "$(git branch --show-current)" = "modularizacion-panel-fase2-api-2026-08-05"
          git fetch origin main
          git fetch origin modularizacion-panel-fase1-2026-08-04

      - name: Separar configuración y API común
        run: node tools/modularizar-api-fase2.mjs index.html js/core/config.js js/core/api.js

      - name: Validar sintaxis de los módulos
        run: |
          node --check js/core/config.js
          node --check js/core/api.js

      - name: Probar configuración respuestas y timeout
        run: node tools/validar-api-fase2.mjs

      - name: Confirmar que solo cambió el alcance funcional esperado
        run: |
          test -f js/core/config.js
          test -f js/core/api.js
          STATUS_INDEX="$(git status --short -- index.html)"
          STATUS_CONFIG="$(git status --short -- js/core/config.js)"
          STATUS_API="$(git status --short -- js/core/api.js)"
          echo "index.html: $STATUS_INDEX"
          echo "config.js: $STATUS_CONFIG"
          echo "api.js: $STATUS_API"
          test "$STATUS_INDEX" = " M index.html"
          test "$STATUS_CONFIG" = "?? js/core/config.js"
          test "$STATUS_API" = "?? js/core/api.js"
          test -z "$(git status --short -- js/core/navigation.js)"

      - name: Guardar resultado solo en la rama aislada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/core/config.js js/core/api.js
          if git diff --cached --quiet; then
            echo "La Fase 2 ya estaba modularizada."
          else
            git commit -m "Modularizar configuración y API común sin cambiar módulos"
            git push origin HEAD:modularizacion-panel-fase2-api-2026-08-05
          fi

      - name: Resumen
        run: |
          echo "FASE 2 COMPLETADA EN RAMA AISLADA"
          echo "No se publicó ningún cambio en main."
